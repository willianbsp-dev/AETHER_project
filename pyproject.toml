[project]
name = "machine-feira"
version = "0.1.0"
description = "Controle de computador por gestos aéreos"
requires-python = ">=3.11"
dependencies = [
  "mediapipe>=0.10.14,<0.11",
  "pyautogui>=0.9.54",
]

[project.scripts]
machine-feira = "machine_feira.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=8"]
